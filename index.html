<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenesty Beauty Studio — Live Operations & Commission Tracker</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --card-alt: #20242e;
      --border: #2c313d;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #d97706;
      --accent-hover: #b45309;
      --green: #10b981;
      --blue: #3b82f6;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 60px; }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; color: #fff; }
    .brand-sub { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .brand span.loc { font-size: 0.78rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

    .sync-pill {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .sync-pill.offline { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: var(--red); }
    .sync-pill.syncing { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border-color: var(--blue); }

    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: var(--card-alt);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .container { max-width: 1100px; margin: 20px auto; padding: 0 16px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .stat-card .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    .stat-card .sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }
    .val-green { color: var(--green); }
    .val-accent { color: var(--accent); }
    .val-blue { color: var(--blue); }

    .section { display: none; }
    .section.active { display: block; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 20px; }
    @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 14px; color: #fff; display: flex; justify-content: space-between; align-items: center; }

    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 5px; margin-top: 12px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--card-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent); }

    .btn {
      display: inline-block;
      width: 100%;
      padding: 11px 16px;
      margin-top: 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-sm { width: auto; padding: 6px 10px; font-size: 0.78rem; margin-top: 0; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: var(--card-alt); }
    .btn-danger { background: var(--red); }

    .preview-box {
      background: var(--card-alt);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 14px;
      font-size: 0.88rem;
    }
    .preview-row { display: flex; justify-content: space-between; margin-bottom: 4px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
    .badge {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--card-alt);
      border: 1px solid var(--border);
    }
    .badge-mpesa { color: var(--green); border-color: rgba(16,185,129,0.4); }
    .badge-cash { color: var(--accent); border-color: rgba(217,119,6,0.4); }
