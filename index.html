<script>

  const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtw1HcjN0qgj3iHiXMwOG3MGI2DirOIHI5wkdONbpH2KLaXyuHB4jgWNUUrdEQsu3t/exec";

  const DEFAULT_DATA = {
    pin: "1234",
    dailyStudioTarget: 8000,
    techs: [
      { id: 1, name: "Peter (Owner / Master)", rate: 50, specialty: "Nails & Locs" },
      { id: 2, name: "Tech 1 (Nail Artist)", rate: 35, specialty: "Gel & Acrylics" },
      { id: 3, name: "Tech 2 (Loctician)", rate: 40, specialty: "Dreadlocks & Reties" }
    ],
    services: [
      { id: 1, name: "Builder Gel Overlay", price: 1500 },
      { id: 2, name: "Acrylic Sculpted Extensions", price: 2500 },
      { id: 3, name: "Polygel Full Set", price: 2200 },
      { id: 4, name: "Gel Polish Manicure (Roniki)", price: 800 },
      { id: 5, name: "3D Moulding / Tier 3 Nail Art", price: 1000 },
      { id: 6, name: "Dreadlocks Retie & Styling", price: 1200 },
      { id: 7, name: "Sisterlocks Retie", price: 2500 },
      { id: 8, name: "Loc Detox & Wash", price: 800 }
    ],
    logs: []
  };

  let state = JSON.parse(localStorage.getItem("zenesty_studio_v2")) || DEFAULT_DATA;
  let scriptUrl = localStorage.getItem("zenesty_sheet_url") || DEFAULT_SCRIPT_URL;
  let adminUnlocked = false;

  function saveLocal() {
    localStorage.setItem("zenesty_studio_v2", JSON.stringify(state));
  }

  function setSyncBadge(status, text) {
    const el = document.getElementById("syncStatus");
    el.className = "sync-pill " + status;
    el.textContent = text;
  }

  async function syncFromCloud() {
    if (!scriptUrl) {
      setSyncBadge("offline", "Local Mode (No Sheet URL)");
      return;
    }
    setSyncBadge("syncing", "Syncing...");
    try {
      const bustUrl = scriptUrl + (scriptUrl.includes("?") ? "&" : "?") + "_t=" + Date.now();
      const res = await fetch(bustUrl, { cache: "no-store" });
      const json = await res.json();
      if (json.status === "ok" && json.data) {
        state = json.data;
        saveLocal();
        renderAll();
        setSyncBadge("", "Live • Google Sheets");
      }
    } catch (err) {
      setSyncBadge("offline", "Offline (Cached)");
    }
  }

  async function pushToCloud(payload) {
    saveLocal();
    renderAll();
    if (!scriptUrl) return;
    setSyncBadge("syncing", "Saving to Sheet...");
    try {
      const res = await fetch(scriptUrl, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.status === "ok" && json.data) {
        state = json.data;
        saveLocal();
        renderAll();
        setSyncBadge("", "Live • Google Sheets");
      }
    } catch (err) {
      setSyncBadge("offline", "Sync Error (Saved Locally)");
    }
  }

  function saveSheetUrl() {
    const url = document.getElementById("sheetUrlInput").value.trim();
    if (!url.startsWith("https://script.google.com/")) {
      alert("Please enter a valid Google Apps Script Web App URL.");
      return;
    }
    scriptUrl = url;
    localStorage.setItem("zenesty_sheet_url", url);
    syncFromCloud();
  }

  function getTodayStr() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now - offset).toISOString().split("T")[0];
  }

  function setToday() {
    document.getElementById("filterDate").value = getTodayStr();
    renderAll();
  }

  function checkSunday(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    document.getElementById("sundayBanner").style.display = (d.getDay() === 0) ? "block" : "none";
  }

  function switchTab(tabId, btnEl) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(tabId).classList.add("active");
    if (btnEl) btnEl.classList.add("active");
    renderAll();
  }

  function openAdmin() {
    if (!adminUnlocked) {
      const entered = prompt("Enter Admin PIN:");
      if (entered !== String(state.pin)) {
        alert("Incorrect PIN.");
        return;
      }
      adminUnlocked = true;
    }
    document.getElementById("sheetUrlInput").value = scriptUrl;
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("admin-view").classList.add("active");
    document.querySelectorAll(".tab-btn")[2].classList.add("active");
  }

  async function runCommand() {
    const raw = document.getElementById("adminCmdInput").value.trim();
    const feedback = document.getElementById("cmdFeedback");
    if (!raw) return;
